<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenMetrics Coin (GMC) - Wallet</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center p-4">

  <!-- ========================================== -->
  <!-- ΟΘΟΝΗ LOGIN -->
  <!-- ========================================== -->
  <div id="loginScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 mt-10">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-green-700 tracking-wide">🌿 GreenMetrics</h1>
      <p class="text-gray-500 text-sm mt-1">Το οικολογικό σου πορτοφόλι</p>
    </div>
    
    <!-- Είσοδος με υπάρχον κλειδί -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Έχεις ήδη πορτοφόλι;</label>
        <input id="privateKeyInput" type="password" placeholder="Επικόλληση Private Key (0x...)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
      </div>
      <button onclick="loginWithKey()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md transition">
        🔓 Είσοδος
      </button>
    </div>

    <div class="mt-8 border-t border-gray-200 pt-6 text-center">
      <p class="text-xs text-gray-500 mb-3">Νέος χρήστης;</p>
      <button onclick="createNewWallet()" class="w-full bg-gray-50 hover:bg-gray-100 text-green-800 font-bold py-3 rounded-xl transition border border-gray-300">
        ✨ Δημιουργία Νέου Πορτοφολιού
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- ΚΥΡΙΩΣ ΕΦΑΡΜΟΓΗ (Κρυμμένη αρχικά) -->
  <!-- ========================================== -->
  <div id="mainApp" class="hidden w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden mt-4 mb-8">
    
    <!-- Header -->
    <div class="bg-green-700 text-white p-5 text-center relative">
      <h1 class="text-2xl font-bold tracking-wide">🌿 GreenMetrics</h1>
      <p class="text-green-100 text-xs mt-1">Δίκτυο Sepolia</p>
      
      <!-- Κουμπί Αποσύνδεσης -->
      <button onclick="logout()" title="Αποσύνδεση" class="absolute top-4 right-4 text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition font-bold shadow">
        Αποσύνδεση
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-200 bg-gray-50">
      <button id="tabCitizenBtn" onclick="showTab('citizen')" class="w-1/2 py-3 text-center font-semibold text-green-700 border-b-2 border-green-700 transition">
        👤 Πολίτης (Πληρωμή)
      </button>
      <button id="tabMerchantBtn" onclick="showTab('merchant')" class="w-1/2 py-3 text-center font-semibold text-gray-500 hover:text-green-700 transition">
        🏪 Έμπορος (Είσπραξη)
      </button>
    </div>

    <!-- TAB 1: ΠΟΛΙΤΗΣ -->
    <div id="tabCitizen" class="p-6 space-y-6">
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
        <span class="text-xs text-green-800 uppercase font-semibold tracking-wider">Διαθέσιμο Υπόλοιπο</span>
        <div id="citizenBalance" class="text-3xl font-extrabold text-green-800 my-1">Φόρτωση...</div>
        <button onclick="refreshBalance()" class="text-xs text-green-600 hover:text-green-800 underline font-medium mt-1">🔄 Ανανέωση</button>
      </div>

      <div class="text-center space-y-1">
        <span class="text-xs text-gray-500 font-medium">Η Διεύθυνσή σας (Wallet):</span>
        <p id="citizenAddress" class="text-xs font-mono bg-gray-100 p-2 rounded break-all border border-gray-200 text-gray-700 select-all"></p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Ποσό GMC προς Πληρωμή:</label>
          <input id="transferAmount" type="number" step="0.1" placeholder="π.χ. 2.0" class="w-full text-lg font-bold p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
        </div>
        
        <!-- Επιλογή 1: Σκανάρισμα QR -->
        <button id="btnScanQR" onclick="startCitizenScanner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 transition">
          📷 Σκανάρισμα QR & Άμεση Πληρωμή
        </button>
        <div id="reader" class="hidden w-full overflow-hidden rounded-xl border-2 border-blue-400"></div>

        <!-- Επιλογή 2: Χειροκίνητη Πληρωμή με Επικόλληση Διεύθυνσης -->
        <div class="space-y-2 pt-2 border-t border-gray-200">
          <label class="block text-xs font-medium text-gray-600">Ή πληκτρολόγησε / επικόλληση διεύθυνσης εμπόρου:</label>
          <div class="flex gap-2">
            <input id="manualRecipient" type="text" placeholder="0x..." class="w-full text-xs font-mono p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
            <button onclick="payManual()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 rounded-lg text-sm transition">Πληρωμή</button>
          </div>
        </div>

        <p id="txStatus" class="hidden text-xs text-center font-semibold p-2 rounded bg-blue-50 text-blue-700"></p>
      </div>
    </div>

    <!-- TAB 2: ΕΜΠΟΡΟΣ -->
    <div id="tabMerchant" class="p-6 space-y-6 hidden">
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
        <span class="text-xs text-green-800 uppercase font-semibold tracking-wider">Υπόλοιπο Ταμείου</span>
        <div id="merchantBalance" class="text-3xl font-extrabold text-green-800 my-1">Φόρτωση...</div>
        <button onclick="refreshBalance()" class="text-xs text-green-600 hover:text-green-800 underline font-medium mt-1">🔄 Ανανέωση</button>
      </div>

      <div class="text-center space-y-3">
        <span class="text-xs text-gray-500 font-medium">Διεύθυνση Είσπραξης:</span>
        <p id="merchantAddress" class="text-xs font-mono bg-gray-100 p-2 rounded break-all border border-gray-200 text-gray-700 select-all"></p>
        <div class="flex justify-center pt-2">
          <div id="merchantQrcode" class="p-3 bg-white rounded-xl border border-gray-200 shadow-md"></div>
        </div>
        <p class="text-xs text-gray-500 max-w-xs mx-auto">Δείξτε αυτό το QR στον πολίτη για να λάβετε την πληρωμή.</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
